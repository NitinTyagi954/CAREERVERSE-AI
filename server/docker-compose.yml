version: '3.8'

services:
  # MongoDB Database
  mongo:
    image: mongo:7.0
    container_name: careerverse-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: careerverse
    volumes:
      - mongo_data:/data/db
    networks:
      - careerverse-network

  # CareerVerse Backend Server
  server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: careerverse-server
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: development
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/careerverse
      JWT_SECRET: your_super_secret_jwt_key_change_this_in_production
      UPLOAD_DIR: ./uploads
      MIN_STIPEND: 30000
      USE_OPENAI: false
      ADMIN_EMAILS: admin@careerverse.com,test@careerverse.com
    volumes:
      - ./uploads:/app/uploads
      - ./logs:/app/logs
    depends_on:
      - mongo
    networks:
      - careerverse-network
    command: npm run dev

  # MongoDB Express (Database Admin UI) - Optional
  mongo-express:
    image: mongo-express:1.0.0
    container_name: careerverse-mongo-express
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://mongo:27017/
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: admin123
    depends_on:
      - mongo
    networks:
      - careerverse-network

volumes:
  mongo_data:

networks:
  careerverse-network:
    driver: bridge

